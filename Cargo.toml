[package]
name    = "twine-solana-programs"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members  = [
    "tokens_gateway",
    "twine_chain",
]

[workspace.dependencies]
base64ct                 = "=1.6.0"
borsh                    = "0.10"
hex                      = "0.4.3"
libsecp256k1             = { version = "0.7.1", default-features = false, features = ["hmac", "static-context"] }
num-bigint               = "0.4.6"
num-traits               = "0.2"
sha3                     = "0.10.8"
solana-bn254             = "2.1.6"
solana-program           = "1.18.26"
solana-secp256k1-recover = "2.1.6"
sp1-solana               = { git = "https://github.com/succinctlabs/sp1-solana" }
spl-token                = { version = "4.0.0", features = ["no-entrypoint"] }
thiserror                = "1.0.63"
tokio                    = { version = "1.0", features = ["macros", "rt"], default-features = false }
tokens_gateway           = { path = "./tokens_gateway", features = ["no-entrypoint"] }
twine_chain              = { path = "./twine_chain", features = ["no-entrypoint"] }

[dev-dependencies]
borsh                        = { workspace = true }
dirs                         = "5"
ethabi                       = "18.0.0"
hex                          = { workspace = true }
libsecp256k1                 = { workspace = true }
rlp                          = "0.5"
serde                        = { version = "1.0", features = ["derive"] }
sha3                         = { workspace = true }
solana-program               = { workspace = true }
solana-program-test          = "1.18.26"
solana-sdk                   = "1.18.26"
spl-associated-token-account = "2.3.0"
spl-token                    = { workspace = true }
test-case                    = "3.3"
tokio-test                   = "0.4"
tokens_gateway               = { workspace = true }
twine_chain                  = { workspace = true }
